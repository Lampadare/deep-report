[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-report"
version = "0.1.8"
description = "Multi-agent research report generator powered by Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
    "questionary>=2.0.0",
    "portalocker>=2.0,<4",
]

[project.optional-dependencies]
# Pull in the Python-installable academic MCP servers as console scripts.
# Node-based MCPs (Brave, Firecrawl, Tavily, cyanheads/*) install on demand via `npx -y`.
# Upper bounds are conservative — bump them deliberately when new majors land.
research = [
    "arxiv-mcp-server>=0.5.0,<1",
    "wikipedia-mcp>=2.0.1,<3",
]
all = ["deep-report[research]"]
dev = ["pytest", "ruff"]

[project.scripts]
deep-report = "deep_report.cli:main"

[project.urls]
Homepage = "https://github.com/lampadare/deep-report"
Repository = "https://github.com/lampadare/deep-report"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_report"]

[tool.hatch.build.targets.sdist]
# Allowlist mode — nothing slips in. Hatchling forces .gitignore into
# sdists regardless of this config; it's harmless (wheel excludes it,
# never installed).
only-include = [
  "src/deep_report",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
