[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-report"
version = "0.1.3"
description = "Multi-agent research report generator powered by Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
# Pull in the Python-installable academic MCP servers as console scripts.
# Node-based MCPs (Brave, Firecrawl, Tavily, cyanheads/*) install on demand via `npx -y`.
# Upper bounds are conservative — bump them deliberately when new majors land.
research = [
    "arxiv-mcp-server>=0.5.0,<1",
    "wikipedia-mcp>=2.0.1,<3",
]
# Heavier vertical MCPs for domain-specific reports
vertical = [
    "deep-report[research]",
    "sec-edgar-mcp>=1.0.8,<2",
    "patent-mcp-server>=0.9.5,<1",
]
all = ["deep-report[vertical]"]
dev = ["pytest", "ruff"]

[project.scripts]
deep-report = "deep_report.cli:main"

[project.urls]
Homepage = "https://github.com/lampadare/deep-report"
Repository = "https://github.com/lampadare/deep-report"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_report"]

[tool.hatch.build.targets.sdist]
exclude = [
  "SEARCH_TOOLS.md",
  "SEARCH_TOOLS_FIXES.md",
  "uv.lock",
  ".gitignore",
  "tests/",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
